name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        arch: [arm64, arm, x86, x86_64, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android-sdk@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk: 25.2.9519653
          cmdline-tools: latest
      - name: Build
        run: ./gradlew --no-daemon -Darch=${{ matrix.arch }} assembleDebug
      - name: Sign & rename
        run: |
          BT=$ANDROID_HOME/build-tools/35.0.0
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug" -keyalg RSA -keysize 2048 -validity 10000
          $BT/zipalign -p -f 4 "$APK" /tmp/aligned.apk
          $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out /tmp/Cliorius-Launcher-${{ matrix.arch }}.apk /tmp/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: /tmp/Cliorius-Launcher-${{ matrix.arch }}.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apk-*/Cliorius-Launcher-*.apk
          body: "Lihat CHANGELOG.md untuk detail pembaruan. Pilih APK sesuai arsitektur perangkat Anda."
